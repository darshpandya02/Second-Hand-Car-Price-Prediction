[project]
name = "carprice"
version = "2.0.0"
description = "Used-car price prediction on the CarDekho vehicle dataset, with a browser demo"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Darsh Pandya" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.5,<1.10",
    "threadpoolctl>=3",
]

[project.scripts]
carprice = "carprice.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/carprice"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
